<body class="bg-background font-body-md text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden">
<!-- Background Decor -->
<div class="absolute inset-0 z-0 pointer-events-none">
<div class="absolute top-[-10%] right-[-5%] w-[40vw] h-[40vw] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[35vw] h-[35vw] rounded-full bg-secondary/5 blur-[100px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[480px] px-margin-mobile md:px-0 z-10 py-stack-lg">
<!-- Brand Identity Section -->
<div class="flex flex-col items-center mb-stack-lg">
<div class="w-16 h-16 bg-primary rounded-xl shadow-lg flex items-center justify-center mb-stack-md">
<span class="material-symbols-outlined text-on-primary text-[32px]" data-icon="electric_bolt">electric_bolt</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">KashiCurrent</h1>
<p class="font-body-md text-on-surface-variant mt-2 text-center">Premium Electrical Services at Your Fingertips</p>
</div>
<!-- Login Card -->
<div class="glass-card rounded-xl p-stack-lg shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant/20">
<!-- Role Toggle -->
<div class="bg-surface-container-low p-1 rounded-lg flex mb-stack-lg border border-outline-variant/10">
<button class="flex-1 py-2 font-label-md text-label-md bg-white shadow-sm rounded-md text-primary transition-all">
                    I am a Homeowner
                </button>
<button class="flex-1 py-2 font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all">
                    I am an Electrician
                </button>
</div>
<!-- Credentials Form -->
<form class="space-y-stack-md">
<div class="space-y-2">
<label class="font-label-md text-label-md text-outline" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-white/50 focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline-variant font-body-md" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-outline" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-12 py-3 rounded-lg border border-outline-variant bg-white/50 focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-outline-variant font-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-all" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant select-none" for="remember">Remember me for 30 days</label>
</div>
<!-- Action Button -->
<button class="w-full py-4 bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-lg hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all mt-stack-sm" type="submit">
                    Sign in to Account
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-stack-lg">
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
<span class="font-caption text-caption text-outline">OR CONTINUE WITH</span>
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-stack-md">

<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-3 py-3 px-4 rounded-lg border border-outline-variant bg-white hover:bg-surface-container-low transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="font-label-md text-label-md text-on-surface">Apple</span>
</button>
</div>
</div>
<!-- Footer Links -->
<div class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                New to KashiCurrent? 
                <a class="text-primary font-label-md font-bold hover:underline" href="#">Create an account</a>
</p>
